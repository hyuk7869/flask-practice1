{% extends 'base.html' %}

{% block content %}
<h2>Edit Todo</h2>
<form method="post">
    <input type="text" name="todo" value="{{ todo.text }}" required>
    <input type="text" name="note" value="{{ todo.note or '' }}">
    <button type="submit">저장</button>
</form>
<a href="{{ url_for('index') }}">목록으로</a>
{% endblock %}
